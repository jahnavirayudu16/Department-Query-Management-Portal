{% extends 'base.html' %}

{% block title %}Sign In | Department Query Management Portal{% endblock %}

{% block content %}
<div style="max-width: 480px; margin: 2rem auto;">
  <div class="card" style="padding: 2.25rem; background: #ffffff; border: 1px solid var(--border-color); box-shadow: var(--shadow-md);">
    <div style="text-align: center; margin-bottom: 1.5rem;">
      <div class="sidebar-logo" style="margin: 0 auto 0.75rem; width: 48px; height: 48px; font-size: 1.4rem;">🎓</div>
      <h2 style="font-size: 1.5rem; font-weight: 800; color: var(--text-main);">Welcome Back</h2>
      <p style="font-size: 0.85rem; color: var(--text-muted);">Sign in to access your queries and department support</p>
    </div>

    <!-- 1-Click Fast Demo Login Switcher (Student & Faculty) -->
    <div style="margin-bottom: 1.5rem; background: #f8fafc; padding: 1rem; border-radius: var(--radius-md); border: 1px dashed var(--border-color);">
      <div style="font-size: 0.75rem; font-weight: 800; text-transform: uppercase; color: var(--text-muted); margin-bottom: 0.65rem; text-align: center;">
        ⚡ 1-Click Fast Demo Login:
      </div>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.65rem;">
        <button type="button" class="btn btn-secondary btn-sm demo-account-btn" data-email="student@college.com" data-password="student123" style="font-weight: 800; padding: 0.65rem; font-size: 0.88rem; background: #ffffff; border: 2px solid #cbd5e1;">
          👨‍🎓 Student
        </button>
        <button type="button" class="btn btn-secondary btn-sm demo-account-btn" data-email="faculty@college.com" data-password="faculty123" style="font-weight: 800; padding: 0.65rem; font-size: 0.88rem; background: #ffffff; border: 2px solid #cbd5e1;">
          👩‍🏫 Faculty
        </button>
      </div>
      <div style="display: flex; justify-content: center; align-items: center; gap: 0.75rem; margin-top: 0.75rem; font-size: 0.78rem; color: #64748b;">
        <span style="font-weight: 600;">Other Demo Roles:</span>
        <button type="button" class="demo-account-btn" data-email="cse-hod@college.com" data-password="hod123" style="background: none; border: none; padding: 0; color: #4338ca; font-weight: 700; text-decoration: underline; cursor: pointer;">
          🎓 Dept HOD
        </button>
        <span>•</span>
        <button type="button" class="demo-account-btn" data-email="admin@college.com" data-password="admin123" style="background: none; border: none; padding: 0; color: #9f1239; font-weight: 700; text-decoration: underline; cursor: pointer;">
          ⚡ Admin
        </button>
      </div>
    </div>

    <!-- Login Form -->
    <form method="POST" action="{{ url_for('login') }}">
      <div class="form-group">
        <label for="email" class="form-label">College Email Address</label>
        <input type="email" id="email" name="email" class="form-control" placeholder="name@college.com" required autofocus>
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 0.5rem;">
        Sign In to Portal →
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.5rem; font-size: 0.85rem; color: var(--text-muted);">
      Don't have an account? <a href="{{ url_for('register') }}" style="font-weight: 700;">Register here</a>
    </div>
  </div>
</div>
{% endblock %}
